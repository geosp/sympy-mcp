[project]
name = "sympy-mcp"
version = "0.1.0"
description = "A MCP server for symbolic manipulation of mathematical expressions"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "mcp-service-kit @ git+https://github.com/geosp/mcp-service-kit@v0.1.0",
    "sympy==1.14.0",
    "fastmcp>=4.1.3",
    "einsteinpy==0.4.0",
]

[project.scripts]
sympy-mcp = "sympy_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "black>=25.1.0",
    "pytest>=8.3.5",
    "ruff>=0.11.10",
]
relativity = [
    "einsteinpy>=0.4.0",
]

[tool.uv]
default-groups = []

[tool.pytest]
testpaths = ["tests"]
python_files = "test_*.py"
