[project]
name = "sympy-mcp"
dynamic = ["version"]
description = "A MCP server for symbolic manipulation of mathematical expressions"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "mcp-service-kit @ git+https://github.com/geosp/mcp-service-kit@v0.2.1",
    "sympy==1.14.0",
    "fastmcp==4.1.4",
    "einsteinpy==0.4.0",
]

[project.scripts]
sympy-mcp = "sympy_mcp.server:main"

[build-system]
# hatch-vcs derives the version from git tags (v2.0.0 -> 2.0.0; untagged commits get a .devN version)
requires = ["hatchling", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Only used for builds without git metadata (e.g. the Docker build, which passes VERSION instead)
fallback_version = "0.0.0"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "black>=25.1.0",
    "pytest>=9.1",
    "ruff>=0.11.10",
]
relativity = [
    "einsteinpy>=0.4.0",
]

[tool.uv]
default-groups = []
# Rebuild the package when the commit or tags change, so the git-derived version stays current
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.pytest]
testpaths = ["tests"]
python_files = ["test_*.py"]
