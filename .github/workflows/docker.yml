name: Docker

on:
  schedule:
    - cron: "27 0 * * *"
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # all tags, for the version

      # The image has no .git, so compute the version from tags here and pass it in
      - name: Compute version from git tags
        id: version
        run: |
          python3 -m venv /tmp/hatch
          /tmp/hatch/bin/pip install --quiet hatchling==1.32.4 hatch-vcs==0.5.0
          echo "version=$(/tmp/hatch/bin/python -m hatchling version)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login against a Docker registry except on PR
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=edge
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      # Build a single-platform image into the local daemon and check that the
      # server starts, before anything is pushed
      - name: Build image for smoke test
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: sympy-mcp:ci
          cache-from: type=gha
          platforms: linux/amd64
          build-args: VERSION=${{ steps.version.outputs.version }}

      - name: Smoke test (server starts, /health and MCP initialize answer)
        run: docker/smoke-test.sh sympy-mcp:ci 8081

      # Build and push Docker image with Buildx
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
